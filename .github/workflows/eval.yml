name: Benchmark (live models)
# Actions tab -> "Benchmark" -> Run workflow. Writes synthetic interrogations (if asked) and measures each method.
# Also runs when .github/requests/eval.json changes, e.g.
#   {"synth": "0", "test_synth": "40", "test_generator": "zai-org/GLM-5.2", "test_seed": "303", "append_test": "1",
#    "split": "dev", "n": "30", "methods": "keyword,one_prompt,provenance"}
# synth = new TRAINING interrogations (replaces them); test_synth = new TEST interrogations from test_generator
# (append_test=1 keeps other writers' test interrogations); split = which interrogations to score (test|dev|train|trainval).
on:
  push:
    paths: [".github/requests/eval.json"]
  workflow_dispatch:
    inputs:
      synth: { description: "Generate N new synthetic interrogations first (0 = reuse)", required: true, default: "0" }
      n: { description: "How many interrogations to score", required: true, default: "30" }
      methods: { description: "keyword,one_prompt,provenance", required: true, default: "keyword,one_prompt,provenance" }
permissions:
  contents: write
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Which run
        env:
          EVENT: ${{ github.event_name }}
          IN_SYNTH: ${{ inputs.synth }}
          IN_N: ${{ inputs.n }}
          IN_METHODS: ${{ inputs.methods }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os, re, sys
          if os.environ["EVENT"] == "push":
              d = json.load(open(".github/requests/eval.json"))
          else:
              d = {"synth": os.environ["IN_SYNTH"], "n": os.environ["IN_N"], "methods": os.environ["IN_METHODS"]}
          v = {"SYNTH": str(d.get("synth", "0")), "N": str(d.get("n", "30")), "METHODS": str(d.get("methods", "keyword,one_prompt,provenance")),
               "TEST_SYNTH": str(d.get("test_synth", "0")), "TEST_GENERATOR": str(d.get("test_generator", "Qwen/Qwen3-30B-A3B-Instruct-2507")),
               "TEST_SEED": str(d.get("test_seed", "101")), "APPEND_TEST": str(d.get("append_test", "0")), "SPLIT": str(d.get("split", "test")),
               "REPORT": str(d.get("report", "0")), "DRAFT_KT": str(d.get("draft_kt", ""))}
          ok = {"SYNTH": r"\d+", "N": r"\d+", "METHODS": r"[a-z_,]+", "TEST_SYNTH": r"\d+", "TEST_GENERATOR": r"[A-Za-z0-9._/-]+",
                "TEST_SEED": r"\d+", "APPEND_TEST": r"[01]", "SPLIT": r"test|dev|train|trainval", "REPORT": r"[01]",
                "DRAFT_KT": r"|trainval|test"}
          for k, x in v.items():
              if not re.fullmatch(ok[k], x):
                  sys.exit(f"bad value for {k}: {x!r}")
              print(f"{k}={x}")
          PY
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          ENDPOINT_URL: ${{ secrets.ENDPOINT_URL }}
          ENDPOINT_TOKEN: ${{ secrets.ENDPOINT_TOKEN }}
          DAILY_SPEND_CAP_USD: "15"
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          mkdir -p eval
          if [ "$SYNTH" != "0" ]; then
            python -m scripts.synth --n "$SYNTH" --split trainval --generator deepseek-ai/DeepSeek-V4.1-Flash-1017 2>&1 | tee -a eval/synth_log.txt
          fi
          if [ "$TEST_SYNTH" != "0" ]; then
            python -m scripts.synth --n "$TEST_SYNTH" --split test --seed "$TEST_SEED" --generator "$TEST_GENERATOR" $([ "$APPEND_TEST" = "1" ] && echo --append) 2>&1 | tee -a eval/synth_log.txt
          fi
          if [ "$SYNTH" != "0" ] || [ "$TEST_SYNTH" != "0" ]; then python -m scripts.build_pairs 2>&1 | tee -a eval/synth_log.txt; fi
          if [ "$REPORT" = "1" ]; then python train/report.py provenance-matcher eval/training.json 2>&1 | tee eval/report_log.txt; fi
          if [ -n "$DRAFT_KT" ]; then python -m scripts.draft_key_terms --file "$DRAFT_KT" 2>&1 | tee eval/key_terms_log.txt; fi
          if [ "$N" != "0" ]; then
            SUF=$([ "$SPLIT" = "test" ] || echo "_$SPLIT")
            python -m eval.run_eval --split "$SPLIT" --n "$N" --methods "$METHODS" 2>&1 | tee "eval/eval_log$SUF.txt"
            cat "eval/RESULTS$SUF.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval data/synth 2>/dev/null || true
          git commit -m "Benchmark results" || echo "No changes"
          for i in 1 2 3 4; do if git pull --rebase -q && git push; then exit 0; fi; sleep 7; done
          echo "couldn't push the results"; exit 1
