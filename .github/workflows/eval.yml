name: Benchmark (live models)
# Actions tab -> "Benchmark" -> Run workflow. Writes synthetic interrogations (if asked) and measures each method.
# Also runs when .github/requests/eval.json changes: {"synth": "40", "n": "30", "methods": "keyword,one_prompt,provenance"}.
on:
  push:
    paths: [".github/requests/eval.json"]
  workflow_dispatch:
    inputs:
      synth: { description: "Generate N new synthetic interrogations first (0 = reuse)", required: true, default: "0" }
      n: { description: "How many interrogations to score", required: true, default: "30" }
      methods: { description: "keyword,one_prompt,provenance", required: true, default: "keyword,one_prompt,provenance" }
permissions:
  contents: write
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Which run
        env:
          EVENT: ${{ github.event_name }}
          IN_SYNTH: ${{ inputs.synth }}
          IN_N: ${{ inputs.n }}
          IN_METHODS: ${{ inputs.methods }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os, re, sys
          if os.environ["EVENT"] == "push":
              d = json.load(open(".github/requests/eval.json"))
          else:
              d = {"synth": os.environ["IN_SYNTH"], "n": os.environ["IN_N"], "methods": os.environ["IN_METHODS"]}
          v = {"SYNTH": str(d.get("synth", "0")), "N": str(d.get("n", "30")), "METHODS": str(d.get("methods", "keyword,one_prompt,provenance"))}
          ok = {"SYNTH": r"\d+", "N": r"\d+", "METHODS": r"[a-z_,]+"}
          for k, x in v.items():
              if not re.fullmatch(ok[k], x):
                  sys.exit(f"bad value for {k}: {x!r}")
              print(f"{k}={x}")
          PY
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          ENDPOINT_URL: ${{ secrets.ENDPOINT_URL }}
          ENDPOINT_TOKEN: ${{ secrets.ENDPOINT_TOKEN }}
          DAILY_SPEND_CAP_USD: "15"
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          mkdir -p eval
          if [ "$SYNTH" != "0" ]; then python -m scripts.synth --n "$SYNTH" --split trainval --generator deepseek-ai/DeepSeek-V4.1-Flash-1017 2>&1 | tee -a eval/synth_log.txt; python -m scripts.synth --n 20 --split test --seed 101 --generator Qwen/Qwen3-30B-A3B-Instruct-2507 2>&1 | tee eval/synth_log.txt; fi
          python -m eval.run_eval --n "$N" --methods "$METHODS" 2>&1 | tee eval/eval_log.txt
          cat eval/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval data/synth 2>/dev/null || true
          git commit -m "Benchmark results" || echo "No changes"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
