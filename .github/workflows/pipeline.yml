name: Run case pipeline (live models)
# Actions tab -> "Run case pipeline" -> Run workflow. Reads transcripts with Nemotron 3.5 Super VL, drafts facts,
# tags sentences with Nemotron 3.5 Lightning and verifies deciding lines with Nemotron 3 Ultra. Commits the results.
# Also runs when .github/requests/pipeline.json changes: {"case": "dassey", "steps": "ingest", "sessions": "S2", "max_pages": "6"}.
on:
  push:
    paths: [".github/requests/pipeline.json"]
  workflow_dispatch:
    inputs:
      case: { description: "Case id (folder under data/cases)", required: true, default: "dassey" }
      steps: { description: "Comma list: ingest,pageeval,facts,tag,oneprompt", required: true, default: "ingest,tag" }
      sessions: { description: "Only these sessions for ingest (e.g. S1,S2); blank = all", required: false, default: "" }
      max_pages: { description: "Limit pages per session for a quick test (0 = all)", required: false, default: "0" }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Which run
        env:
          EVENT: ${{ github.event_name }}
          IN_CASE: ${{ inputs.case }}
          IN_STEPS: ${{ inputs.steps }}
          IN_SESSIONS: ${{ inputs.sessions }}
          IN_MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os, re, sys
          if os.environ["EVENT"] == "push":
              d = json.load(open(".github/requests/pipeline.json"))
          else:
              d = {"case": os.environ["IN_CASE"], "steps": os.environ["IN_STEPS"], "sessions": os.environ["IN_SESSIONS"],
                   "max_pages": os.environ["IN_MAX_PAGES"]}
          v = {"CASE": str(d.get("case", "dassey")), "STEPS": str(d.get("steps", "ingest,tag")), "SESSIONS": str(d.get("sessions", "")),
               "MAX_PAGES": str(d.get("max_pages", "0")), "PAGES": str(d.get("pages", ""))}
          ok = {"CASE": r"[a-z0-9_-]+", "STEPS": r"[a-z,]+", "SESSIONS": r"[A-Za-z0-9,]*", "MAX_PAGES": r"\d+", "PAGES": r"[0-9,-]*"}
          for k, x in v.items():
              if not re.fullmatch(ok[k], x):
                  sys.exit(f"bad value for {k}: {x!r}")
              print(f"{k}={x}")
          PY
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr >/dev/null
      - run: pip install -r requirements.txt
      - name: Pipeline
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          DAILY_SPEND_CAP_USD: "15"
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          mkdir -p logs
          STEPS_=",$STEPS,"
          if [[ "$STEPS_" == *",ingest,"* ]]; then python -m scripts.ingest "$CASE" --sessions "$SESSIONS" --max-pages "$MAX_PAGES" ${PAGES:+--pages "$PAGES"} 2>&1 | tee -a logs/pipeline.txt; fi
          if [[ "$STEPS_" == *",pageeval,"* ]]; then python -m scripts.page_eval "$CASE" 2>&1 | tee -a logs/pipeline.txt; fi
          if [[ "$STEPS_" == *",facts,"* ]]; then python -m scripts.facts "$CASE" 2>&1 | tee -a logs/pipeline.txt; fi
          if [[ "$STEPS_" == *",tag,"* ]]; then python -m scripts.tag "$CASE" 2>&1 | tee -a logs/pipeline.txt; fi
          if [[ "$STEPS_" == *",reaudit,"* ]]; then python -m scripts.tag "$CASE" --reaudit --memo 2>&1 | tee -a logs/pipeline.txt; fi
          if [[ "$STEPS_" == *",suspectsearch,"* ]]; then python -m scripts.tag "$CASE" --reaudit --suspect-search --memo 2>&1 | tee -a logs/pipeline.txt; fi
          if [[ "$STEPS_" == *",oneprompt,"* ]]; then python -m scripts.one_prompt_case "$CASE" 2>&1 | tee -a logs/pipeline.txt; fi
          tail -20 logs/pipeline.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "data/cases/$CASE/logs" && cp logs/pipeline.txt "data/cases/$CASE/logs/last_run.txt" 2>/dev/null || true
          git add "data/cases/$CASE" || true
          git commit -m "Pipeline results: $CASE ($STEPS)" || echo "No changes"
          for i in 1 2 3 4; do if git pull --rebase -q && git push; then exit 0; fi; sleep 7; done
          echo "couldn't push the results"; exit 1
